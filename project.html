        // UI Compilation Engine Function
        function updatePage(key) {
            var titleElement = document.getElementById('cat-title');
            var container = document.getElementById('game-list');

            // Set Title text
            if (key === 'home') {
                titleElement.innerHTML = "Latest Games";
            } else {
                titleElement.innerHTML = key.toUpperCase();
            }

            // Fallback object initialization
            var targetGames = categories[key];
            if (!targetGames) {
                targetGames = categories['home'];
            }

            // Build out elements directly via traditional HTML loop concatenation 
            var outputHtml = "";
            for (var i = 0; i < targetGames.length; i++) {
                var item = targetGames[i];
                var currentImage = item.image;
                if (!currentImage) {
                    currentImage = "https://via.placeholder.com/180x115/222/fff?text=NO+IMAGE";
                }

                outputHtml += '<div class="game-card">' +
                    '<table class="game-card-table">' +
                        '<tr>' +
                            '<td class="game-thumb-cell">' +
                                '<img src="' + currentImage + '" alt="Thumbnail">' +
                            '</td>' +
                            '<td class="game-info-cell">' +
                                '<h3 class="game-title">' + item.title + ' Free Download</h3>' +
                                '<div class="meta-tag">' + item.time + '</div>' +
                                '<span class="category-path">in ' + item.cat + '</span>' +
                                '<p class="desc">' + item.desc + '</p>' +
                            '</td>' +
                        '</tr>' +
                    '</table>' +
                '</div>';
            }

            container.innerHTML = outputHtml;
        }

        // Direct Category Click Event Handler Function 
        function changeCategory(buttonElement, categoryKey) {
            // Remove active style state from all structural buttons
            var buttons = document.getElementsByClassName('nav-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = "nav-btn";
            }
            
            // Set current state structure rule
            buttonElement.className = "nav-btn active";
            
            // Trigger compile processing step
            updatePage(categoryKey);
        }

        // Standard initialization loading rules
        window.onload = function() {
            updatePage('home');
        };
